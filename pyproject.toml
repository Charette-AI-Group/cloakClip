[project]
name = "cloak-clip"
version = "0.1.0"
description = "Encrypt and decrypt clipboard text with a password"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    "cryptography>=42,<47",
    "winrt-Windows.ApplicationModel.DataTransfer>=3,<4",
    "winrt-Windows.Foundation>=3,<4",
    "winrt-Windows.Foundation.Collections>=3,<4",
    "winrt-Windows.Storage.Streams>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
    "pyinstaller>=6.10,<7",
]

[project.scripts]
cloak-clip = "cloakClip.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloakClip"]
