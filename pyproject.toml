[project]
name = "cloak-clip"
version = "1.0.1"
description = "Encrypt and decrypt clipboard text with a password"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    "cryptography>=42,<47",
    # Windows-only wheels: the clipboard-history protections. Without the
    # markers, installing on macOS or Linux fails outright.
    "winrt-Windows.ApplicationModel.DataTransfer>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]
build = [
    "pyinstaller>=6.10,<7",
    # Converts the icon to the platform format at build time.
    "pillow>=10,<12",
]

[project.scripts]
cloak-clip = "cloakClip.main:main"

[tool.pytest.ini_options]
# tests/ is on the path for platformSkips, shared by both test folders.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# platformSkips lives in tests/, so group it with the app rather than with
# the third-party packages it would otherwise be sorted among.
known-first-party = ["cloakClip", "platformSkips"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloakClip"]
